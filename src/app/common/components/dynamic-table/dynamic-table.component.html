<div class="card">
    <div class="flex justify-content-center mb-3">
    <p-table [value]="dataList" class="w-full" [tableStyle]="{ 'min-width': '50rem'}" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                @for (col of cols; track $index) {
                    <th>{{col.label}}</th>
                }
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-dataItem>
            <tr>
                @for (col of cols; track $index) {
                    <td>{{ dataItem[col.key] }}</td>
                }
            </tr>
        </ng-template>
    </p-table>
    </div>
</div>
