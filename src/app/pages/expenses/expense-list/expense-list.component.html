<div class="table-container">
  <p-table 
    [value]="expenses" 
    [columns]="cols"
    styleClass="p-datatable-striped p-datatable-gridlines"
    [rowsPerPageOptions]="[10, 15, 30, 40, 50]"
    [paginator]="true" 
    [rows]="15"
    [scrollable]="true" 
    scrollHeight="400px"
    dataKey="id"
    [globalFilterFields]="['date', 'category', 'amount', 'payment_method', 'vendor', 'status']"
  >
    <!-- Header with Filters -->
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th *ngFor="let col of columns">
          {{ col.header }}
        </th>
        <th>Actions</th>
      </tr>
      <tr>
        <!-- Date Filter -->
        <th>
          <p-columnFilter
            type="date"
            field="date"
            placeholder="Search by date"
            ariaLabel="Filter Date"
          ></p-columnFilter>
        </th>
        <!-- Category Filter -->
        <th>
          <p-columnFilter
            type="text"
            field="category"
            placeholder="Search by category"
            ariaLabel="Filter Category"
          ></p-columnFilter>
        </th>
        <!-- Amount Filter -->
        <th>
          <p-columnFilter
            type="numeric"
            field="amount"
            placeholder="Search by amount"
            ariaLabel="Filter Amount"
          ></p-columnFilter>
        </th>
        <!-- Payment Method Filter -->
        <th>
          <p-columnFilter
            type="text"
            field="payment_method"
            placeholder="Search by payment method"
            ariaLabel="Filter Payment Method"
          ></p-columnFilter>
        </th>
        <!-- Vendor Filter -->
        <th>
          <p-columnFilter
            type="text"
            field="vendor"
            placeholder="Search by vendor"
            ariaLabel="Filter Vendor"
          ></p-columnFilter>
        </th>
        <!-- Status Filter -->
        <th>
          <p-columnFilter
            type="text"
            field="status"
            placeholder="Search by status"
            ariaLabel="Filter Status"
          ></p-columnFilter>
        </th>
        <!-- Actions Column (No Filter) -->
        <th></th>
      </tr>
    </ng-template>

    <!-- Scrollable Table Body -->
    <ng-template pTemplate="body" let-expense>
      <tr>
        <td>{{ expense.date ? (expense.date | date) : '' }} </td>
        <td>{{ getExpenseCategoryLabel(expense.category) }}</td>
        <td>{{ expense.amount | currency:expense.currency }}</td>
        <td>{{ expense.payment_method }}</td>
        <td>{{ expense.vendor || '-' }}</td>
        <td>
          <p-tag 
            [value]="expense.status"
            [severity]="getStatusSeverity(expense.status)"
          ></p-tag>
        </td>
        <td>
          <div class="flex gap-2">
            <button 
              pButton
              icon="pi pi-pencil"
              class="p-button-rounded p-button-text"
              (click)="showDialog(expense)"
            ></button>
            <button 
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger"
              (click)="deleteExpense(expense.expense_id)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Empty Message -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">
          No records found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog 
  header="{{ selectedExpense ? 'Edit' : 'Add' }} Expense" 
  [(visible)]="displayDialog"
  [style]="{ width: '600px' }"
  (onHide)="onDialogClose(false)"
>
  <app-expense-form
    *ngIf="displayDialog"
    [expense]="selectedExpense"
    (save)="onSaveExpense($event)"
    (cancel)="onDialogClose(false)"
  ></app-expense-form>
</p-dialog>
