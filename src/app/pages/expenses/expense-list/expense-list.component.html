<div>
  
    <p-table 
      [value]="expenses" 
      [columns]="cols"
      styleClass="p-datatable-striped p-datatable-gridlines"
      [paginator]="true" 
      [rows]="10"
    >
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns">
            {{ col.header }}
          </th>
          <th>Actions</th>
        </tr>
      </ng-template>
  
      <ng-template pTemplate="body" let-expense>
        <tr>
          <td>{{ expense.date | date }}</td>
          <td>{{ getExpenseCategoryLabel(expense.category) }}</td>
          <td>{{ expense.amount | currency:expense.currency }}</td>
          <td>{{ expense.payment_method }}</td>
          <td>{{ expense.vendor || '-' }}</td>
          <td>
            <p-tag 
              [value]="expense.status"
              [severity]="getStatusSeverity(expense.status)"
            ></p-tag>
          </td>
          <td>
            <div class="flex gap-2">
              <button 
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text"
                (click)="showDialog(expense)"
              ></button>
              <button 
                pButton
                icon="pi pi-trash"
                class="p-button-rounded p-button-text p-button-danger"
                (click)="deleteExpense(expense.expense_id)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  
    <p-dialog 
      header="{{ selectedExpense ? 'Edit' : 'Add' }} Expense" 
      [(visible)]="displayDialog"
      [style]="{ width: '600px' }"
      (onHide)="onDialogClose(false)"
    >
      <app-expense-form
        *ngIf="displayDialog"
        [expense]="selectedExpense"
        (save)="onSaveExpense($event)"
        (cancel)="onDialogClose(false)"
      ></app-expense-form>
    </p-dialog>
  </div>
