<app-page-header [heading]="'My reports'" [heading2]="'Reports'" [buttonLabel]="'Report'" [showActionButton]="false"></app-page-header>
<div class="custom-page-container w-full flex justify-center mt-12 print:mt-0">
    <div class="w-full">
        <p-accordion [multiple]="true" [activeIndex]="">
            <p-accordionTab>
                <ng-template pTemplate="header">
                    <div class="print:hidden">
                        Sales Summary
                    </div>
                </ng-template>
                <app-sales-summary type="sales-summary"></app-sales-summary>
            </p-accordionTab>
            <p-accordionTab>
                <ng-template pTemplate="header">
                    <div class="print:hidden">
                        Sales By Product
                    </div>
                </ng-template>
                <app-sales-summary type="by-product"></app-sales-summary>
            </p-accordionTab>
            <p-accordionTab>
                <ng-template pTemplate="header">
                    <div class="print:hidden">
                        Sales By Customer
                    </div>
                </ng-template>
                <app-sales-summary type="by-customer"></app-sales-summary>
            </p-accordionTab>
        </p-accordion>
    </div>
</div>
