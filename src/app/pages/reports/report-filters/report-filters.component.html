<div class="w-full">
    <form [formGroup]="filterForm" (ngSubmit)="onSubmit()">
        <div class="flex sm:flex-row flex-col-reverse sm:gap-4 items-center justify-between gap-2 w-full md:pr-4 md:pl-2 pr-4 pl-4">
            <div class="sm:w-1/2 w-full flex flex-row items-center gap-1 relative z-10">
                <label class="w-32">Date Range:</label>
                <p-calendar 
                    class="right-border-none w-full border-2 border-gray-300 bg-white h-10 sm:px-1 rounded-lg text-sm focus:outline-none" 
                    formControlName="rangeDates"
                    selectionMode="range" 
                    [readonlyInput]="true" 
                />
            </div>
            <div class="sm:w-1/2 w-full flex gap-6 items-center justify-center sm:justify-end">
                @if(type === 'sort') {
                    <i
                        [ngClass]="{
                            'pi-sort-amount-down': selectedSortOrder === 'desc',
                            'pi-sort-amount-up': selectedSortOrder === 'asc',
                        }"
                        class="pi cursor-pointer" (click)="onToggleSort()" style="font-size: 2rem"></i>
                }
                <p-selectButton 
                    formControlName="option"
                    [options]="options"
                    optionLabel="name" 
                    optionValue="value"
                />
            </div>
        </div>
    </form>
</div>
